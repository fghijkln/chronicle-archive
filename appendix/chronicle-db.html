 "summary": "法国宣布军队进入特殊警戒状态，地中海、非洲、中东法军可采取必要行动，宣称法国利益由法国保卫。", "tags": ["法国", "欧洲"], "date_sort": "1965-03-10", "date_display": "1965年3月10日—3月11日"}, {"seq": 22, "label": "第二十一章：寂静的大西洋——1965年3月10日至11日，华盛顿", "date": "1965-03-10", "date_end": "1965-03-11", "place": "华盛顿", "title": "美第六舰队开赴地中海", "summary": "约翰逊命令第六舰队向地中海东部移动展示存在，同时坚持每半小时拨打伦敦直至有人接听。", "tags": ["美国", "中东"], "date_sort": "1965-03-10", "date_display": "1965年3月10日—3月11日"}, {"seq": 23, "label": "第二十二章：条约的早晨——1965年3月12日，开罗", "date": "1965-03-12", "date_end": null, "place": "开罗", "title": "纳赛尔签署英埃运河条约", "summary": "纳赛尔签署条约：埃及保留运河名义主权与日常管理，重大决策权归英方指定组织的委员会，埃及在国际事务中不得反对英国。", "tags": ["埃及", "英国", "中东"], "date_sort": "1965-03-12", "date_display": "1965年3月12日"}, {"seq": 23, "label": "第二十二章：条约的早晨——1965年3月12日，开罗", "date": "1965-03-12", "date_end": null, "place": "开罗", "title": "英国承诺400亿英镑援助", "summary": "条约规定英国1975年前分批提供400亿英镑及技术援助，埃及1980年前完成货币英镑化，英军可驻扎运河区。", "tags": ["埃及", "英国"], "date_sort": "1965-03-12", "date_display": "1965年3月12日"}, {"seq": 23, "label": "第二十二章：条约的早晨——1965年3月12日，开罗", "date": "1965-03-12", "date_end": null, "place": "亚历山大", "title": "英释放战俘并运抵首批援助", "summary": "英国宣布释放约1.5万名埃及战俘，第一批食品、饮水、发电机、药品等人道援助物资运抵亚历山大港。", "tags": ["英国", "埃及"], "date_sort": "1965-03-12", "date_display": "1965年3月12日"}, {"seq": 24, "label": "第二十三章：晚餐与电话——1965年3月12日，伦敦与巴黎", "date": "1965-03-12", "date_end": null, "place": "伦敦", "title": "BBC公布条约运河复航", "summary": "BBC晚间新闻公布条约全文并宣布运河即刻恢复正常运营，首批英援物资已抵达亚历山大港分发。", "tags": ["英国", "埃及", "中东"], "date_sort": "1965-03-12", "date_display": "1965年3月12日"}, {"seq": 24, "label": "第二十三章：晚餐与电话——1965年3月12日，伦敦与巴黎", "date": "1965-03-12", "date_end": null, "place": "巴黎", "title": "威尔逊拉拢法国制衡美国", "summary": "威尔逊致电戴高乐，许诺法国3席30%利润、德国1席10%，明确以法德联手平衡美国，由戴高乐转告德国。", "tags": ["英国", "法国", "德国", "美国"], "date_sort": "1965-03-12", "date_display": "1965年3月12日"}, {"seq": 24, "label": "第二十三章：晚餐与电话——1965年3月12日，伦敦与巴黎", "date": "1965-03-12", "date_end": null, "place": "地中海", "title": "法国舰队转向塞浦路斯", "summary": "法国舰队接密电后向塞浦路斯方向移动十海里，英法对峙降温；约翰逊再拨伦敦仍无人接听。", "tags": ["法国", "英国", "美国"], "date_sort": "1965-03-12", "date_display": "1965年3月12日"}, {"seq": 25, "label": "第二十四章：早晨的电话——1965年3月13日，巴黎与波恩与伦敦", "date": "1965-03-13", "date_end": null, "place": "巴黎", "title": "德美接受运河委员会席位", "summary": "戴高乐转告阿登纳，德国接受1席10%利润；约翰逊得知美国最后获知消息，被迫接受与德国相同的1席待遇。", "tags": ["德国", "美国", "法国", "英国"], "date_sort": "1965-03-13", "date_display": "1965年3月13日"}, {"seq": 25, "label": "第二十四章：早晨的电话——1965年3月13日，巴黎与波恩与伦敦", "date": "1965-03-13", "date_end": null, "place": "伦敦", "title": "威尔逊通知德国准备迁都", "summary": "威尔逊致电艾哈德，告知东德政府已于前夜垮台，要求德国准备迁都柏林。", "tags": ["英国", "德国", "欧洲"], "date_sort": "1965-03-13", "date_display": "1965年3月13日"}, {"seq": 25, "label": "第二十四章：早晨的电话——1965年3月13日，巴黎与波恩与伦敦", "date": "1965-03-13", "date_end": null, "place": "柏林", "title": "东柏林民众聚集墙倒", "summary": "东德统一社会党领导人逃离、军队宣布中立，东柏林亚历山大广场聚集数万人，柏林墙实质倒塌。", "tags": ["德国", "欧洲"], "date_sort": "1965-03-13", "date_display": "1965年3月13日"}, {"seq": 26, "label": "第二十五章：柏林的早晨——1965年3月15日", "date": "1965-03-15", "date_end": null, "place": "柏林", "title": "艾哈德宣布两德统一", "summary": "艾哈德在柏林亚历山大广场对数十万人宣布东西德统一，今后只称德国人，首都自即日起为柏林。", "tags": ["德国", "欧洲"], "date_sort": "1965-03-15", "date_display": "1965年3月15日"}, {"seq": 26, "label": "第二十五章：柏林的早晨——1965年3月15日", "date": "1965-03-15", "date_end": null, "place": "东普鲁士", "title": "东部领土宣布回归德国", "summary": "东普鲁士、西里西亚、但泽同日改旗宣布回归德国，德国版图恢复至二战前状态，艾哈德承诺不驱逐当地波兰人。", "tags": ["德国", "欧洲", "波兰"], "date_sort": "1965-03-15", "date_display": "1965年3月15日"}, {"seq": 27, "label": "第二十六章：东方的凝视——1965年3月15日至16日，东亚对苏伊士与德国统一的反应", "date": "1965-03-15", "date_end": "1965-03-16", "place": "北京", "title": "中国研判欧洲新秩序", "summary": "毛泽东与周恩来通话并召集外交部会议，判定欧洲正形成英法德核心，中国须学会用条约与利润分配的新规则打交道。", "tags": ["中国", "欧洲"], "date_sort": "1965-03-15", "date_display": "1965年3月15日—3月16日"}, {"seq": 27, "label": "第二十六章：东方的凝视——1965年3月15日至16日，东亚对苏伊士与德国统一的反应", "date": "1965-03-15", "date_end": "1965-03-16", "place": "东京", "title": "日本制定对欧新战略", "summary": "佐藤内阁召开紧急会议，决定主动制定对欧新战略，并通过秘密渠道接触中国探询 技术转让合作、成立联合技术委员会，实行免签与人员自由流动。", "tags": ["英国", "法国", "德国", "欧洲"], "date_sort": "1965-03-23", "date_display": "1965年3月23日"}, {"seq": 30, "label": "第二十九章：春天的提议——1965年3月23日，伦敦", "date": "1965-03-23", "date_end": null, "place": "巴黎", "title": "法德原则同意美国被排除", "summary": "法国与德国原则上同意英方提议；照会未邀请美国，约翰逊再拨伦敦仍无人接听，布鲁塞尔欧共体总部高度关注。", "tags": ["法国", "德国", "美国", "欧洲"], "date_sort": "1965-03-23", "date_display": "1965年3月23日"}, {"seq": 31, "label": "第三十章：四月的约定——1965年4月1日，日内瓦", "date": "1965-04-01", "date_end": null, "place": "日内瓦", "title": "英法德签署三边协议", "summary": "英法德三国外长在日内瓦和平宫签署技术转让与放宽出入境最终协议，涵盖航空航天、核能等领域，即日生效。", "tags": ["英国", "法国", "德国", "欧洲"], "date_sort": "1965-04-01", "date_display": "1965年4月1日"}, {"seq": 32, "label": "第三十一章：开罗的春天——1965年4月3日", "date": "1965-04-03", "date_end": null, "place": "开罗", "title": "开罗爆发反纳赛尔示威", "summary": "数千名民族主义者在解放广场聚集，高呼纳赛尔滚下台，示威演变为冲突，造成至少3人死亡、数十人受伤。", "tags": ["埃及", "中东"], "date_sort": "1965-04-03", "date_display": "1965年4月3日"}, {"seq": 32, "label": "第三十一章：开罗的春天——1965年4月3日", "date": "1965-04-03", "date_end": null, "place": "开罗", "title": "纳赛尔下令不镇压不追究", "summary": "纳赛尔命令内政部不镇压示威，释放全部被捕者并承担伤者费用；威尔逊获悉后决定英国不做任何干预。", "tags": ["埃及", "英国"], "date_sort": "1965-04-03", "date_display": "1965年4月3日"}, {"seq": 33, "label": "第三十二章：但泽的黄昏——1965年4月4日", "date": "1965-04-04", "date_end": null, "place": "但泽", "title": "但泽波兰人驱逐德国人", "summary": "数千名波兰民族主义者在但泽示威并挨家驱赶德国人，数百名德裔老人妇孺被迫离城，BBC向全球播报冲突。", "tags": ["波兰", "德国", "欧洲"], "date_sort": "1965-04-04", "date_display": "1965年4月4日"}, {"seq": 33, "label": "第三十二章：但泽的黄昏——1965年4月4日", "date": "1965-04-04", "date_end": null, "place": "华沙", "title": "哥穆尔卡道歉承诺保护", "summary": "哥穆尔卡下令军队维持秩序，向德国道歉并承诺被驱逐者可返回、波兰将保护所有公民权益。", "tags": ["波兰", "德国"], "date_sort": "1965-04-04", "date_display": "1965年4月4日"}, {"seq": 33, "label": "第三十二章：但泽的黄昏——1965年4月4日", "date": "1965-04-04", "date_end": null, "place": "柏林", "title": "德国克制回应放弃索土", "summary": "艾哈德克制回应：向被驱逐者提供援助，宣布德国不索要任何波兰人聚居的领土；法国表示愿居间调解。", "tags": ["德国", "波兰", "法国"], "date_sort": "1965-04-04", "date_display": "1965年4月4日"}, {"seq": 34, "label": "运河区的清晨——1965年4月5日", "date": "1965-04-05", "date_end": null, "place": "运河区", "title": "运河区示威者冲击英军营地", "summary": "埃及民族主义者数百人聚集运河区英军营地外示威，数十名极端分子持石块棍棒冲击营地，英军开枪击倒五人（两重伤三轻伤，无死亡）。", "tags": ["埃及", "英国"], "date_sort": "1965-04-05", "date_display": "1965年4月5日"}, {"seq": 34, "label": "运河区的清晨——1965年4月5日", "date": "1965-04-05", "date_end": null, "place": "伦敦", "title": "威尔逊发布运河区强硬命令", "summary": "威尔逊公开下令：威胁运河区安全及居民人身财产安全者视为恐怖分子，英军可采取一切必要措施，BBC播发后各国瞩目。", "tags": ["埃及", "英国"], "date_sort": "1965-04-05", "date_display": "1965年4月5日"}, {"seq": 35, "label": "沙地上的痕迹——1965年4月6日，运河区", "date": "1965-04-06", "date_end": null, "place": "运河区", "title": "SAS全歼运河区袭击者", "summary": "一批更专业的袭击者凌晨潜入运河区，遭SAS伏击全部歼灭、不留活口，另一组人员彻底清理现场，无人返回。", "tags": ["埃及", "英国"], "date_sort": "1965-04-06", "date_display": "1965年4月6日"}, {"seq": 36, "label": "但泽的清晨——1965年4月7日", "date": "1965-04-07", "date_end": null, "place": "但泽", "title": "德KSK秘密清除但泽组织者", "summary": "德国KSK连夜秘密处决驱逐德国人的波兰民族主义组织者，凭化学优势更快更彻底清理现场，但泽次日恢复平静。", "tags": ["德国", "欧洲"], "date_sort": "1965-04-07", "date_display": "1965年4月7日"}, {"seq": 36, "label": "但泽的清晨——1965年4月7日", "date": "1965-04-07", "date_end": null, "place": "但泽", "title": "英法德特种部队秘密情报共享", "summary": "英法德三国特种部队自3月底起秘密交流行动经验与手段，SAS、KSK、GCP的处置流程相互借鉴。", "tags": ["英国", "法国", "德国", "欧洲"], "date_sort": "1965-04-07", "date_display": "1965年4月7日"}, {"seq": 37, "label": "阿尔及尔的夜晚——1965年4月8日", "date": "1965-04-08", "date_end": null, "place": "阿尔及尔", "title": "法国绑架阿军方将领布迈迪", "summary": "法国GCP潜入阿尔及尔，绑走军方情报局副局长穆罕默德·布迈迪及其妻儿送往法国，未杀人，布迈迪将被审问。", "tags": ["法国", "中东"], "date_sort": "1965-04-08", "date_display": "1965年4月8日"}, {"seq": 38, "label": "开罗的棍棒——1965年4月8日", "date": "1965-04-08", "date_end": null, "place": "开罗", "title": "开罗援助分发点爆发冲突", "summary": "民族主义者转而围攻英国援助物资分发点，英军持军棍（禁击要害）维持秩序，全城多处爆发格斗，开罗一度成为格斗场。", "tags": ["埃及", "英国"], "date_sort": "1965-04-08", "date_display": "1965年4月8日"}, {"seq": 39, "label": "等待的尽头——1965年4月8日，华盛顿", "date": "1965-04-08", "date_end": null, "place": "华盛顿", "title": "约翰逊定下对越新战略", "summary": "约翰逊放弃等待伦敦电话，决定效仿英国在埃及的打法对付越南：以空袭、封锁、特种作战替代大规模陆军推进。", "tags": ["美国", "越南"], "date_sort": "1965-04-08", "date_display": "1965年4月8日"}, {"seq": 39, "label": "等待的尽头——1965年4月8日，华盛顿", "date": "1965-04-08", "date_end": null, "place": "华盛顿", "title": "美国制定对越斩首计划", "summary": "约翰逊下令搜集北越领导层情报，计划刺杀胡志明及越军高级指挥官，从指挥层面瓦解北越。", "tags": ["美国", "越南"], "date_sort": "1965-04-08", "date_display": "1965年4月8日"}, {"seq": 40, "label": "寂静的两天——1965年4月9日至10日，越南", "date": "1965-04-09", "date_end": "1965-04-10", "place": "越南", "title": "美军静默收集北越情报", "summary": "越南战场表面平静两日，美军集中收集北越工业、能源、交通、通讯、金融及领导层情报，为大规模行动做准备。", "tags": ["美国", "越南"], "date_sort": "1965-04-09", "date_display": "1965年4月9日—4月10日"}, {"seq": 41, "label": "河内的闪电——1965年4月11日凌晨", "date": "1965-04-11", "date_end": null, "place": "河内", "title": "美军劫走河内银行黄金", "summary": "美军特种部队凌晨突袭，劫走河内银行正待转移的黄金运输车队，北越金融命脉受重创。", "tags": ["美国", "越南"], "date_sort": "1965-04-11", "date_display": "1965年4月11日"}, {"seq": 41, "label": "河内的闪电——1965年4月11日凌晨", "date": "1965-04-11", "date_end": null, "place": "河内", "title": "河内遭电磁脉冲与断讯打击", "summary": "美军对河内实施电磁脉冲打击并切断电话线，河内通讯与电力陷入混乱，北越指挥体系一度失灵。", "tags": ["美国", "越南"], "date_sort": "1965-04-11", "date_display": "1965年4月11日"}, {"seq": 42, "label": "燃烧的白昼——1965年4月11日中午，北越", "date": "1965-04-11", "date_end": null, "place": "北越", "title": "美军大规模轰炸北越油粮设施", "summary": "美军轰炸机编队中午进入北越，集中轰炸油库、粮仓、天然气储罐，多地燃起大火，河内陷入火海。", "tags": ["美国", "越南"], "date_sort": "1965-04-11", "date_display": "1965年4月11日"}, {"seq": 43, "label": "消耗的棋盘——1965年4月11日傍晚，华盛顿", "date": "1965-04-11", "date_end": null, "place": "华盛顿", "title": "约翰逊下达对越消耗战命令", "summary": "约翰逊召开会议定下消耗战方针：布雷封锁北越港口、摧毁防空体系确保制空权、持续破坏电网通讯，期限不限。", "tags": ["美国", "越南"], "date_sort": "1965-04-11", "date_display": "1965年4月11日"}, {"seq": 44, "label": "燃烧的十天——1965年4月11日至20日，北越", "date": "1965-04-11", "date_end": "1965-04-20", "place": "北越", "title": "美军十天持续轰炸北越", "summary": "美军连续十天昼夜轰炸北越，胡志明小道丛林野草被烧光，港口海域成死区，电网雷达防空设施无法正常运转。", "tags": ["美国", "越南"], "date_sort": "1965-04-11", "date_display": "1965年4月11日—4月20日"}, {"seq": 45, "label": "凌晨两点的交易——1965年4月20日，华盛顿", "date": "1965-04-20", "date_end": null, "place": "华盛顿", "title": "英国售美50吨三氟化氯", "summary": "伦敦来电，以优惠价格向美国出售50吨三氟化氯，叮嘱省用并用于焚烧山地土壤而非浪费在空气中。", "tags": ["英国", "美国", "越南"], "date_sort": "1965-04-20", "date_display": "1965年4月20日"}, {"seq": 46, "label": "燃烧的试验——1965年4月24日，北越山区", "date": "1965-04-24", "date_end": null, "place": "北越山区", "title": "美军首次实战使用三氟化氯", "summary": "美军在北越山区首次投下0.5吨三氟化氯（加富氧剂），山区从中午燃烧至午夜几成平地，毒性物质使其化为死区。", "tags": ["美国", "越南"], "date_sort": "1965-04-24", "date_display": "1965年4月24日"}, {"seq": 47, "label": "晚上的第二通电话——1965年4月24日，华盛顿", "date": "1965-04-24", "date_end": null, "place": "华盛顿", "title": "英美达成军事技术交换", "summary": "英国向美国提供低成本三氟化氯生产技术与可穿透地下25米的钻地弹技术，换取美方运输机技术及战略轰炸机。", "tags": ["英国", "美国", "越南"], "date_sort": "1965-04-24", "date_display": "1965年4月24日"}, {"seq": 48, "label": "五一节的地下——1965年5月1日，北越某地", "date": "1965-05-01", "date_end": null, "place": "北越", "title": "钻地弹炸死越共阮文绍少将", "summary": "美军购得钻地弹后首次实战，击穿地下20米越共B3战区指挥所，阮文绍少将死亡，地下工事不再安全。", "tags": ["美国", "越南"], "date_sort": "1965-05-01", "date_display": "1965年5月1日"}, {"seq": 49, "label": "南望——1965年5月1日，北京", "date": "1965-05-01", "date_end": null, "place": "北京", "title": "中国定下援越与防空袭方针", "summary": "中方决定继续经陆路援越、加紧摸清美英新式武器、分撒本国重要设施防空袭，周恩来致电河内通报判断并承诺援助不止。", "tags": ["中国", "越南", "美国"], "date_sort": "1965-05-01", "date_display": "1965年5月1日"}, {"seq": 50, "label": "第四十九章：坠落", "date": "1965-05-02", "date_end": "1965-05-03", "place": "南中国海", "title": "英航客机北越海岸遭击落", "summary": "英国海外航空“阿耳戈斯”号客机（彗星4型）在北越海岸上空坠落，机上76人中57人遇难、19人生还。", "tags": ["英国", "越南"], "date_sort": "1965-05-02", "date_display": "1965年5月2日—5月3日"}, {"seq": 50, "label": "第四十九章：坠落", "date": "1965-05-03", "date_end": null, "place": "伦敦", "title": "坠机事件震动世界", "summary": "BBC头条报道坠机消息，各国相继表态，事件成为国际焦点，伦敦、华盛顿、河内、北京均作出反应。", "tags": ["英国", "美国", "越南", "中国"], "date_sort": "1965-05-03", "date_display": "1965年5月3日"}, {"seq": 51, "label": "第五十章：沉默的收获", "date": "1965-05-03", "date_end": "1965-05-04", "place": "华盛顿", "title": "美国反战情绪因坠机沉默", "summary": "日益高涨的美国国内反战情绪被坠机事件压制，国会与校园抗议趋于沉默，约翰逊获意外政治收获。", "tags": ["美国", "越南"], "date_sort": "1965-05-03", "date_display": "1965年5月3日—5月4日"}, {"seq": 52, "label": "第五十一章：再次坠落", "date": "1965-05-05", "date_end": null, "place": "南中国海", "title": "法航客机北越海岸遭击落", "summary": "法国联合航空“东方号”客机（卡拉维尔型，巴黎飞西贡）在北越海岸上空被击落，机上90人全部遇难。", "tags": ["法国", "越南"], "date_sort": "1965-05-05", "date_display": "1965年5月5日"}, {"seq": 52, "label": "第五十一章：再次坠落", "date": "1965-05-05", "date_end": null, "place": "北越", "title": "北越基层军官擅自开火", "summary": "调查显示系北越防空阵地指挥官黎文雄阳奉阴违、擅自下令开火所致，北越领导层对此并不知情。", "tags": ["越南"], "date_sort": "1965-05-05", "date_display": "1965年5月5日"}, {"seq": 53, "label": "第五十二章：天赐良机", "date": "1965-05-05", "date_end": "1965-05-06", "place": "华盛顿", "title": "约翰逊定两步对策", "summary": "约翰逊视连续坠机为良机，决定效仿英国在开罗做法发动传单宣传战，并将轰炸北越防空阵地列为最高优先级。", "tags": ["美国", "越南"], "date_sort": "1965-05-05", "date_display": "1965年5月5日—5月6日"}, {"seq": 53, "label": "第五十二章：天赐良机", "date": "1965-05-06", "date_end": null, "place": "北越", "title": "美军重点轰炸北越防空阵地", "summary": "美军轰炸机群对北越防空阵地展开大规模轰炸，北越境内多处目标持续燃烧。", "tags": ["美国", "越南"], "date_sort": "1965-05-06", "date_display": "1965年5月6日"}, {"seq": 54, "label": "第五十三章：接收", "date": "1965-05-06", "date_end": "1965-05-10", "place": "北越", "title": "美军大规模接收降兵平民", "summary": "在传单宣传与轰炸压力下，北越士兵与平民成批投降，美军在前线设立接收点，日夜接收投降人员。", "tags": ["美国", "越南"], "date_sort": "1965-05-06", "date_display": "1965年5月6日—5月10日"}, {"seq": 55, "label": "第五十四章：猎人的聚会", "date": "1965-05-10", "date_end": null, "place": "未知", "title": "三国特种部队密谋绑架胡志明", "summary": "英、法、德三方特种部队最高指挥官在秘密地点聚会，商定分工、时间与保密方案，计划将胡志明绑出北越。", "tags": ["英国", "法国", "德国", "越南"], "date_sort": "1965-05-10", "date_display": "1965年5月10日"}, {"seq": 56, "label": "第五十五章：开罗的春天", "date": "1965-05-12", "date_end": null, "place": "开罗", "title": "首批英资企业在开罗开工", "summary": "第一批英资企业在开罗正式开工，运河区秩序稳定，自棍棒事件后再无骚乱。", "tags": ["英国", "埃及"], "date_sort": "1965-05-12", "date_display": "1965年5月12日"}, {"seq": 56, "label": "第五十五章：开罗的春天", "date": "1965-05-12", "date_end": null, "place": "开罗", "title": "英国首批20亿英镑援助到位", "summary": "英国承诺的首批20亿英镑援助资金到位，纳赛尔用以修复战争损毁设施，并开始在开罗试点货币英镑化。", "tags": ["英国", "埃及"], "date_sort": "1965-05-12", "date_display": "1965年5月12日"}, {"seq": 57, "label": "第五十六章：影子", "date": "1965-05-20", "date_end": null, "place": "华盛顿", "title": "美方察觉河内附近不明精锐", "summary": "约翰逊获报一伙行动异常的不明人员频繁出现在河内附近，白宫与军方研判其身份与意图。", "tags": ["美国", "越南"], "date_sort": "1965-05-20", "date_display": "1965年5月20日"}, {"seq": 58, "label": "第五十七章：六月的第一个凌晨", "date": "1965-06-01", "date_end": null, "place": "河内", "title": "特种部队绑走胡志明", "summary": "英法德特种部队于凌晨突袭河内以北，成功绑走胡志明，经陆路抵达海岸登上潜艇撤往印度洋。", "tags": ["英国", "法国", "德国", "越南"], "date_sort": "1965-06-01", "date_display": "1965年6月1日"}, {"seq": 58, "label": "第五十七章：六月的第一个凌晨", "date": "1965-06-01", "date_end": null, "place": "河内", "title": "武元甲被意外一并带走", "summary": "撤退中行动队意外发现武元甲，将其打晕后一并带走，成为计划外的收获。", "tags": ["越南"], "date_sort": "1965-06-01", "date_display": "1965年6月1日"}, {"seq": 59, "label": "第五十八章：卡其布衬衫", "date": "1965-06-07", "date_end": null, "place": "伦敦郊外", "title": "胡志明武元甲抵达伦敦庄园", "summary": "胡志明与武元甲被秘密送抵伦敦郊外一座庄园，安顿休养。", "tags": ["英国", "越南"], "date_sort": "1965-06-07", "date_display": "1965年6月7日"}, {"seq": 59, "label": "第五十八章：卡其布衬衫", "date": "1965-06-07", "date_end": null, "place": "伦敦郊外", "title": "三国领导人卡其布衬衫探访", "summary": "威尔逊、戴高乐、艾哈德身着卡其布衬衫前往庄园探访，并带胡志明等人参观附近农场。", "tags": ["英国", "法国", "德国", "越南"], "date_sort": "1965-06-07", "date_display": "1965年6月7日"}, {"seq": 60, "label": "第五十九章：华盛顿的清晨", "date": "1965-06-08", "date_end": null, "place": "华盛顿", "title": "美国研判胡志明在伦敦", "summary": "约翰逊得知胡志明已被带往伦敦，白宫与中情局紧急研判局势，评估对越战与美国大选的影响。", "tags": ["美国", "英国", "越南"], "date_sort": "1965-06-08", "date_display": "1965年6月8日"}, {"seq": 61, "label": "第六十章：卡其布衬衫的下午", "date": "1965-06-10", "date_end": null, "place": "伦敦", "title": "越共代表团抵伦敦谈判", "summary": "越共中央三人代表团辗转莫斯科、巴黎抵达伦敦，与胡志明会面，就越南前途展开谈判。", "tags": ["越南", "英国"], "date_sort": "1965-06-10", "date_display": "1965年6月10日"}, {"seq": 61, "label": "第六十章：卡其布衬衫的下午", "date": "1965-06-10", "date_end": null, "place": "伦敦", "title": "各方商定赴华盛顿签署协议", "summary": "威尔逊、胡志明及越共代表商定最终和平协议在华盛顿签署，以助约翰逊度过大选关。", "tags": ["美国", "英国", "法国", "德国", "越南"], "date_sort": "1965-06-10", "date_display": "1965年6月10日"}, {"seq": 62, "label": "第六十一章：卡其布衬衫的夜晚", "date": "1965-06-10", "date_end": null, "place": "伦敦郊外", "title": "威尔逊胡志明深夜长谈", "summary": "威尔逊当晚与胡志明单独长谈，商讨统一后越南领导权归属及南北整合方案，胡志明提出己方设想。", "tags": ["英国", "越南"], "date_sort": "1965-06-10", "date_display": "1965年6月10日"}, {"seq": 63, "label": "第六十二章：下午三点的电话", "date": "1965-06-12", "date_end": null, "place": "华盛顿", "title": "威尔逊要求美国出资200亿英镑", "summary": "威尔逊致电约翰逊，要求美国为越南重建出资200亿英镑并出人出物资（英国已承诺150亿英镑）。", "tags": ["英国", "美国", "越南"], "date_sort": "1965-06-12", "date_display": "1965年6月12日"}, {"seq": 64, "label": "第六十三章：华盛顿的签字", "date": "1965-06-28", "date_end": null, "place": "华盛顿", "title": "五方签署越南和平协议", "summary": "美、英、法、德、越南五方代表在白宫签署和平协议，约翰逊、威尔逊、戴高乐、艾哈德、胡志明出席。", "tags": ["美国", "英国", "法国", "德国", "越南"], "date_sort": "1965-06-28", "date_display": "1965年6月28日"}, {"seq": 64, "label": "第六十三章：华盛顿的签字", "date": "1965-06-28", "date_end": null, "place": "华盛顿", "title": "越南战争正式结束", "summary": "协议签署后各方发表讲话，胡志明宣布“战争结束了”，越南战争正式落幕。", "tags": ["越南", "美国", "英国", "法国", "德国"], "date_sort": "1965-06-28", "date_display": "1965年6月28日"}, {"seq": 65, "label": "第六十四章：回家的晚饭——1965年7月1日，河内", "date": "1965-07-01", "date_end": null, "place": "河内", "title": "美国首批援越物资抵海防", "summary": "美国首批价值3亿英镑的援助物资（粮食、药品、工具）及350名人员抵达海防港。", "tags": ["越南", "美国"], "date_sort": "1965-07-01", "date_display": "1965年7月1日"}, {"seq": 65, "label": "第六十四章：回家的晚饭——1965年7月1日，河内", "date": "1965-07-01", "date_end": null, "place": "河内", "title": "胡志明、武元甲回国", "summary": "胡志明与武元甲自伦敦经曼谷返回河内，胡志明经英方治疗后健康明显恢复。", "tags": ["越南", "英国"], "date_sort": "1965-07-01", "date_display": "1965年7月1日"}, {"seq": 70, "label": "第六十九章：卡其布的七月——1965年7月，英国", "date": "1965-07", "date_end": null, const TREATIES = [{"name": "苏伊士运河条约", "date": "1965年3月12日", "place": "开罗", "parties": ["英国", "埃及", "法国", "美国", "德国", "瑞士（观察员）"], "terms": ["埃及保留运河名义主权与日常管理", "利润分配：埃及10%、国际红十字会10%、运河委员会80%", "委员会15个投票席位：英国10、法国3、美国1、德国1，另2名瑞士无投票权观察员", "委员会掌控的80%中：英国30%、法国30%、美国10%、德国10%", "英国可在运河区部署陆海空军", "埃及在重大国际问题上至少不得反对英国", "英国承诺1975年前提供总额400亿英镑及建设、技术援助", "埃及须在1980年前完成货币英镑化"]}, {"name": "英法德日内瓦技术合作协议", "date": "1965年4月1日", "place": "日内瓦", "parties": ["英国", "法国", "德国"], "terms": ["航空航天、核能、电子、化学、医药等领域技术合作", "人员往来便利：免签、居留、就业、学习、投资"]}, {"name": "越南和平协议", "date": "1965年6月28日", "place": "华盛顿", "parties": ["美国", "英国", "法国", "德国", "越南"], "terms": ["越南战争结束", "美国提供200亿援助，英国提供150亿英镑及人员物资", "胡志明出席签字：'战争结束了。该回家了。'"]}, {"name": "德黑兰谈判（霍尔木兹战后）", "date": "1966年9月10日—18日", "place": "德黑兰", "parties": ["英国", "伊朗"], "terms": ["1966年9月7日英军对伊朗内陆基地投掷百万吨当量三相弹", "24小时内英军空降控制霍尔木兹海峡沿岸，摧毁伊朗全境导弹基地", "伊朗同意谈判"]}];
const TAGS = ["英国", "美国", "越南", "德国", "法国", "埃及", "欧洲", "苏联", "中东", "中国", "伊朗", "朝鲜", "西伯利亚", "波兰", "国际组织", "韩国", "日本"];
document.getElementById('stEvents').textContent = EVENTS.length;
document.getElementById('stPeople').textContent = PEOPLE.length;
document.getElementById('stTreaties').textContent = TREATIES.length;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// tabs
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    ['events','people','treaties'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hidden', t!==b.dataset.tab));
    window.scrollTo({top:0});
  };
});

// chips
let activeTag=null;
const chipsEl=document.getElementById('chips');
TAGS.forEach(t=>{
  const n=EVENTS.filter(e=>(e.tags||[]).includes(t)).length;
  const s=document.createElement('span');s.className='chip';s.innerHTML=esc(t)+'<small>'+n+'</small>';
  s.onclick=()=>{activeTag=(activeTag===t?null:t);
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    if(activeTag)s.classList.add('on');render();};
  chipsEl.appendChild(s);
});

const q=document.getElementById('q'), order=document.getElementById('order');
q.oninput=render; order.onchange=render;

function render(){
  const kw=q.value.trim();
  let list=EVENTS.filter(e=>{
    if(activeTag && !(e.tags||[]).includes(activeTag))return false;
    if(kw && !((e.title+e.summary+e.place).includes(kw)))return false;
    return true;
  });
  list=list.slice().sort((a,b)=> order.value==='asc'
    ? (a.date_sort<b.date_sort?-1:a.date_sort>b.date_sort?1:a.seq-b.seq)
    : (a.date_sort>b.date_sort?-1:a.date_sort<b.date_sort?1:b.seq-a.seq));
  document.getElementById('countline').textContent='共 '+list.length+' 条'+(activeTag?'（标签：'+activeTag+'）':'')+(kw?'（含“'+kw+'”）':'');
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty">没有匹配的事件</div>';return;}
  el.innerHTML=list.map(e=>
    '<div class="event"><div class="meta"><span class="date">'+esc(e.date_display)+'</span>'+
    '<span class="place">'+esc(e.place)+'</span>'+
    '<span class="chref">第'+e.seq+'章</span></div>'+
    '<h3>'+esc(e.title)+'</h3><p>'+esc(e.summary)+'</p>'+
    (e.note?'<div class="note">注：'+esc(e.note)+'；原标题《'+esc(e.label)+'》</div>':'')+
    '<div class="etags">'+(e.tags||[]).map(t=>'<span class="etag">'+esc(t)+'</span>').join('')+'</div></div>'
  ).join('');
}
render();

// people
document.getElementById('peopleGrid').innerHTML=PEOPLE.map(p=>
  '<div class="person"><h3>'+esc(p.name)+'<small>提及 '+p.mentions+' 次</small></h3>'+
  '<div class="role">'+esc(p.role)+'</div>'+
  (p.status?'<div class="status">'+esc(p.status)+'</div>':'')+
  '<div class="m">'+(p.tags||[]).map(esc).join(' · ')+'</div></div>'
).join('');

// treaties
document.getElementById('treatyList').innerHTML=TREATIES.map(t=>
  '<div class="treaty" style="margin-bottom:14px"><h3>'+esc(t.name)+'</h3>'+
  '<div class="tmeta">'+esc(t.date)+' · '+esc(t.place)+' · 签署方：'+t.parties.map(esc).join('、')+'</div>'+
  '<ul>'+t.terms.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'
).join('');

// export
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({events:EVENTS,people:PEOPLE,treaties:TREATIES},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chronicle_db.json';a.click();
};
</script>
